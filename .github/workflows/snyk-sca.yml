
name: DevSecOps Snyk SCA Scan

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  snyk-scan:
    name: Snyk Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      # Mengambil source code repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Memeriksa dependency dan kerentanan
      - name: Snyk SCA Security Test
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # Mengirim informasi dependency ke Snyk
      - name: Snyk Monitor
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
